<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Agent workspace</title><link rel="stylesheet" href="/static/portal.css"><script defer src="/static/portal.js"></script></head>
<body>
<header><span class="brand">◆</span><b id="name">Agent workspace</b><span id="status" role="status"></span><button id="logout" hidden>Sign out</button></header>
<section id="login"><form id="loginForm"><span class="eyebrow">YOUR AGENT WORKSPACE</span><h1>Welcome back</h1><p>Sign in to continue your conversation.</p><label>Username<input id="username" autocomplete="username" required maxlength="100"></label><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary" type="submit">Sign in</button><p id="loginError" role="alert"></p></form></section>
<main id="workspace" hidden><section class="output"><div class="bar"><b>Surface</b><span>Agent output</span></div><div id="surfaceEmpty">Your agent’s workspace will appear here.</div><iframe id="surface" title="Agent output" hidden allow="fullscreen"></iframe></section><section class="conversation"><div class="bar"><b>Conversation</b><button id="interrupt" disabled>Interrupt</button></div><div id="messages" aria-live="polite"></div><p id="notice" role="status"></p><form id="composer"><label class="sr-only" for="message">Message your agent</label><textarea id="message" placeholder="Message your agent…" rows="3" maxlength="100000" required></textarea><div class="composeFoot"><span>Enter to send · Shift+Enter for a new line</span><button id="send" class="primary" disabled>Send</button></div></form></section></main>
<dialog id="detail"><button id="closeDetail">Close</button><pre id="detailText"></pre></dialog>
</body></html>
