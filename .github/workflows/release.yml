# Release — tag-triggered (v*) cross-platform build via tauri-action.
# Produces a DRAFT GitHub release with installers for all four targets.
#
# Signing/notarization is scaffolded but COMMENTED OUT below — see the
# TODO(G4/G5) markers and scripts/release/README.md for what is blocked
# on the owner (Apple Developer + Azure Trusted Signing accounts).
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs exist so a workflow fix can be PROVEN green without cutting a tag — this
  # workflow was red on every release since v0.1.8 and nobody could see a fix work short of
  # releasing. A dispatch run builds everything but skips the draft-release upload (that
  # step needs a tag to name the release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # LINUX ONLY — deliberately, until the box can actually RUN elsewhere.
    #
    # A Privacy Lodge box is the app PLUS its sidecars, and the essential ones publish
    # linux-gnu builds only: tuwunel (the Matrix homeserver — no box without it) and
    # lk-jwt-service; livekit has no darwin build either. A Windows/macOS installer would
    # therefore install a GUI shell that fails the moment setup starts services — worse than
    # shipping nothing, because it looks like a working product. Windows/macOS users run the
    # box under Docker (jaimemelon/privacy-lodge-box) and use the phone app as normal.
    #
    # To bring a platform back: get real sidecar builds for it, add it to this matrix, and
    # teach scripts/stage-sidecars.sh to stage them (it already fails if tuwunel is missing).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.runner }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          # linuxdeploy walks every ELF in the AppDir — including the bundled tor — and
          # resolves its dependencies against the RUNNER's libraries. tor needs libevent,
          # which the runner image doesn't ship, and that one unresolvable dep fails the
          # whole AppImage. (At runtime tor uses its own libs from sidecars/tor-libs; this
          # is purely so linuxdeploy's scan can complete.)
          sudo apt-get install -y libevent-2.1-7t64 || sudo apt-get install -y libevent-2.1-7

      - name: Install pnpm via corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@latest-10 --activate
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Bundle the box's sidecars (tor / tuwunel / caddy / livekit / lk-jwt) INTO the
      # installer, so a one-click install is a working box instead of a GUI shell that needs
      # scripts/fetch-sidecars.sh run by hand. Linux only, and not for lack of trying: tuwunel
      # (the homeserver) and lk-jwt publish linux-gnu builds ONLY — there is no upstream
      # Windows/macOS binary to ship. The script exits 0 on those platforms, so their
      # installers still build; they just aren't self-contained boxes yet.
      - name: Stage bundled sidecars (Linux)
        if: matrix.name == 'linux-x64'
        run: ./scripts/stage-sidecars.sh

      # ------------------------------------------------------------------
      # TODO(G4/G5): Windows code signing via Azure Trusted Signing — needs
      # the Azure Trusted Signing account (G5). Uncomment this step AND the
      # AZURE_* env slots + signCommand config override on the tauri-action
      # step below once the account + secrets exist.
      # ------------------------------------------------------------------
      # - name: Install trusted-signing-cli (Windows signing)
      #   if: matrix.name == 'win-x64'
      #   run: cargo install trusted-signing-cli --locked

      # On a dispatch run there is no tag, so tagName would be a branch name and the draft
      # release would be created named after it — build only, upload nothing.
      - name: Build only (manual run — no release)
        if: github.event_name == 'workflow_dispatch'
        # --verbose so bundler-tool failures (linuxdeploy et al.) surface their own stderr —
        # without it tauri reports only "failed to run linuxdeploy" and the cause is invisible.
        run: pnpm tauri build --bundles deb appimage --verbose

      - name: Build and publish draft release
        if: github.event_name != 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ----------------------------------------------------------------
          # TODO(G4/G5): Tauri updater artifact signing (minisign). Generate
          # the keypair per scripts/release/README.md, store both secrets in
          # GitHub, then uncomment. Without this, no .sig files and no
          # latest.json are produced, so the in-app updater stays inert.
          # ----------------------------------------------------------------
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          #
          # ----------------------------------------------------------------
          # TODO(G4/G5): macOS signing + notarization — needs Apple Developer
          # account (G4). Uncomment once the certificate + notarytool secrets
          # exist. Until then macOS artifacts are unsigned (Gatekeeper will
          # quarantine them).
          # ----------------------------------------------------------------
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                    # base64-encoded Developer ID Application .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}  # .p12 password
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}          # e.g. "Developer ID Application: Tournesol (TEAMID)"
          # APPLE_ID: ${{ secrets.APPLE_ID }}                                      # Apple ID used by notarytool
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                          # app-specific password for notarytool
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}                            # Apple Developer Team ID
          #
          # ----------------------------------------------------------------
          # TODO(G4/G5): Azure Trusted Signing service-principal credentials
          # (Windows) — needs the Azure account (G5). Used by
          # trusted-signing-cli via the signCommand override (see `args` note
          # below). Until then Windows artifacts are unsigned (SmartScreen
          # will warn).
          # ----------------------------------------------------------------
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Privacy Lodge ${{ github.ref_name }}'
          releaseBody: 'Draft release — see the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          # Generates + uploads latest.json for the Tauri updater once the
          # updater plugin is configured and TAURI_SIGNING_PRIVATE_KEY is set.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
          # ----------------------------------------------------------------
          # TODO(G4/G5): Azure Trusted Signing signCommand slot — when G5
          # lands, append the following to `args` for the win-x64 matrix leg
          # (injected at build time; tauri.conf.json itself stays untouched):
          #
          #   --config '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://weu.codesigning.azure.net -a <ACCOUNT_NAME> -c <CERT_PROFILE_NAME> %1"}}}'
          # ----------------------------------------------------------------
