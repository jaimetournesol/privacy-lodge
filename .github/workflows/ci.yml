# CI — build + check on every push / PR (Linux only; full matrix lives in release.yml)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libevent-2.1-7t64

      - name: Install pnpm via corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@latest-10 --activate
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: svelte-check
        run: pnpm check

      - name: Runtime bundle safety checks
        run: node --test scripts/test-stage-agentnode.mjs

      - name: Restore archive safety checks
        run: python3 -m unittest discover -s docker -p 'test_*.py'

      - name: Stage reviewed Agentnode runtime
        run: pnpm stage:agentnode

      - name: Build staged Agentnode runtime image
        run: docker build -f src-tauri/agentnode-runtime/docker/Dockerfile -t privacy-lodge-agentnode:ci src-tauri/agentnode-runtime

      # frontend must be built first: tauri's generate_context! embeds ../build
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # pl-box guards the box's identity in ~600 lines of bash and has already shipped two
      # silent bugs (backup missing the agent volumes; a SIGPIPE-under-pipefail sniff that
      # misread every large bundle as legacy). These round-trips run against throwaway
      # docker volumes only — ~30s on the runner's stock docker.
      - name: pl-box smoke tests (backup/restore/destroy)
        run: ./scripts/test-pl-box.sh

      - name: Stage bundled sidecars
        run: ./scripts/stage-sidecars.sh

      - name: Tauri build (deb + AppImage)
        run: pnpm tauri build --bundles deb appimage

      - name: Build complete Docker box
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin pl-crypt
          PRIVACY_LODGE_BIN_DIR="$PWD/src-tauri/sidecars" IMAGE=privacy-lodge-box:ci docker/build.sh
      - name: Isolated runtime acceptance
        run: python3 scripts/test-runtime-docker.py --box-image privacy-lodge-box:ci --agent-image privacy-lodge-agentnode:ci

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-lodge-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
